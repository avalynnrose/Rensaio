syntax = "proto3";

package rensaio.rpc.v1;

import "Protos/common.proto";

option csharp_namespace = "Rensaio.RPC.Contracts.V1";

// ---------------------------------------------------------------------------
// Lifecycle and health.
//
// The backend owns the RPC process lifecycle: it spawns the process, reads the
// stdio handshake (see RpcHandshake), waits for readiness via Ping/GetStatus,
// and issues PrepareShutdown on graceful stop. A per-start token is sent on
// every call so only the owning backend can drive the loopback endpoint.
// ---------------------------------------------------------------------------

service ControlService {
  // Liveness/readiness probe. Returns ready=false while still initializing.
  rpc Ping (PingRequest) returns (PingReply);

  // Loaded-extension and LRU statistics.
  rpc GetStatus (StatusRequest) returns (StatusReply);

  // Graceful unload of all interops, then process exit.
  rpc PrepareShutdown (ShutdownRequest) returns (Empty);

  // Server-streaming structured log lines (RpcLogLine.ToLine format). Replaces
  // stdout/stderr capture now that the child is launched detached (no pipes).
  rpc StreamLogs (LogStreamRequest) returns (stream LogLineMessage);

  // Server-streaming liveness. Completes (stream end) when the backend/parent
  // process dies, so the child can shut itself down. The backend holds this open.
  rpc WatchParent (WatchParentRequest) returns (stream Empty);

  // Reads the bridge-global preferences the RPC host has loaded (FlareSolverr,
  // SocksProxy, Browser, interceptors). Returned as JSON in JsonResult (the shared
  // model layer serializes it; see RpcJson).
  rpc GetPreferences (BridgePreferencesRequest) returns (JsonResult);

  // Pushes bridge-global preferences into the RUNNING RPC host. The backend is the
  // source of truth (its SettingsService owns the FlareSolverr/browser settings);
  // without this the RPC host would only ever see whatever preferences.json it
  // happened to load at startup, so a settings change (or a missing file) left
  // FlareSolverr silently disabled and Cloudflare challenges unsolvable.
  rpc SetPreferences (SetBridgePreferencesRequest) returns (Empty);
}

message PingRequest {
  string token = 1;
}

message PingReply {
  bool ready = 1;
  // Handshake protocol version, so backend and RPC can detect mismatches.
  int32 protocol_version = 2;
  string rpc_version = 3;
}

message StatusRequest {
  string token = 1;
}

message StatusReply {
  bool ready = 1;
  int32 loaded_extensions = 2;
  int32 lru_capacity = 3;
  int64 lru_hits = 4;
  int64 lru_misses = 5;
  int64 lru_evictions = 6;
  int64 uptime_seconds = 7;
  string rpc_version = 8;
}

message ShutdownRequest {
  string token = 1;
  string reason = 2;
}

message LogStreamRequest {
  string token = 1;
  // How many recent buffered lines to replay on subscribe (late-join window).
  int32 backlog = 2;
}

message LogLineMessage {
  // One RpcLogLine.ToLine() line, exactly as the old stdout pipe carried it.
  string line = 1;
}

message WatchParentRequest {
  string token = 1;
  // Parent (backend) process id to watch.
  int32 parent_pid = 2;
  // Parent start time (UTC ticks) so a recycled PID is not mistaken for the parent.
  int64 parent_start_utc_ticks = 3;
}

// NOTE: names are prefixed "Bridge" because this package (rensaio.rpc.v1) is shared with
// catalog.proto, which already defines `SetPreferencesRequest` (per-source prefs).
message BridgePreferencesRequest {
  string token = 1;
}

message SetBridgePreferencesRequest {
  string token = 1;
  // JSON-encoded Mihon.ExtensionsBridge.Models.Preferences (RpcJson options).
  string preferences_json = 2;
}
